# Measure prompt processing over a context that was loaded into the prefix
# cache. This is a separate measurement, not a server-side cache toggle.

category: performance
framework: llama-benchy
timeout: 5400

pp: [2048]
tg: [128]
depth: [4096, 16384, 32768, 65536]
concurrency: [1]
runs: 3
warmup_runs: 1
latency_mode: generation
prefix_caching: true
