name: Validate recipes and benchmark profiles

on:
  push:
    branches: [main]
    paths: ["recipes/**", "benchmarks/**", ".sparkrun/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["recipes/**", "benchmarks/**", ".sparkrun/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a new sparkrun release cannot turn the check red without a commit here.
      - name: Install sparkrun
        run: pip install "sparkrun==0.4.1"

      - name: Check the registry manifest
        run: test -f .sparkrun/registry.yaml

      - name: Validate every recipe
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r recipe; do
            echo "::group::$recipe"
            sparkrun recipe validate --strict "$recipe"
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find recipes -name '*.yaml' | sort)
          echo "Validated $count recipe(s)"
          test "$count" -gt 0

      - name: Validate every benchmark profile
        run: |
          set -euo pipefail
          recipe=recipes/qwen3.8-flash-next/vllm/qwen3.8-flash-next-nvfp4-vllm.yaml
          count=0
          while IFS= read -r profile; do
            echo "::group::$profile"
            sparkrun benchmark perf "$recipe" --profile "$profile" --dry-run --solo -H 127.0.0.1
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find benchmarks -name '*.yaml' | sort)
          echo "Validated $count benchmark profile(s)"
          test "$count" -gt 0
