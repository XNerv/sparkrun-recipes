recipe_version: "2"
min_sparkrun_version: "0.4.1"
include: qwen3.8-flash-next-nvfp4-vllm

metadata:
  description: Qwen3.8-Flash-Next (~176B) NVFP4 on one DGX Spark, 500k context via YaRN, MTP, deterministic

defaults:
  max_model_len: 500000
  # Qwen's published YaRN recipe (factor 4 over the native 262144) for contexts past 262k.
  hf_overrides: '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
  # hf_overrides do not reach the MTP draft model, whose max_model_len would stay 262144 and
  # make vLLM abort at startup. Forcing it here fixes the check; YaRN's RoPE is not copied to the drafter.
  speculative_config: '{"method":"mtp","num_speculative_tokens":2,"max_model_len":500000}'

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
